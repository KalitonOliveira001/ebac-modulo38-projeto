<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Cadastro de Produto</title>
</h:head>
<h:body>
    <h2>Cadastro de Novo Produto</h2>
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Nome do Produto:" />
            <h:inputText value="#{produtoController.produto.nome}" />

            <h:outputLabel value="Preço do Produto:" />
            <h:inputText value="#{produtoController.produto.preco}" />
        </h:panelGrid>
        <h:commandButton value="Cadastrar" action="#{produtoController.salvar}" />
    </h:form>
</h:body>
</html>
